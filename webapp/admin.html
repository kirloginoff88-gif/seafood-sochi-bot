<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Seafood Сочи — админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Рабочий инструмент: плотный список, крупные цели для пальца, цвета магазина */
:root{
  --bg:#F3F2EE; --card:#fff; --soft:#ECE8E1; --ink:#0E1C26; --body:#34444F; --muted:#76838C; --line:#E2DDD4;
  --sea:#0E7C86; --sea-ink:#fff; --sea-soft:#E1F0F1; --coral:#E4572E; --coral-soft:#FDEDE7; --ok:#1E8A4C; --ok-soft:#E3F3E9; --warn:#A8641A;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F181E; --card:#16232B; --soft:#1E2E37; --ink:#EDF2F4; --body:#C3CFD5; --muted:#8696A0; --line:#27363F;
  --sea:#3FB3BD; --sea-ink:#06262A; --sea-soft:#163238; --coral:#F07A55; --coral-soft:#3A2219; --ok:#4CC27E; --ok-soft:#173326; --warn:#E0A35A; color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font:14.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:980px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
h1,h2,h3{color:var(--ink);font-weight:800;letter-spacing:-.2px}

/* вход */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:12px}
.login h1{font-size:20px}
.login p{color:var(--muted);font-size:13.5px}

/* шапка */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:12px;padding-block:10px 0}
.hd b{font-size:16px;font-weight:800;color:var(--ink)}
.hd small{color:var(--muted);font-weight:600;font-size:12px}
.hd .sp{flex:1}
.hd a,.hd button{font-size:13px;font-weight:700;color:var(--sea);text-decoration:none}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px 0}
.tab{padding:9px 13px 11px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--coral)}
.tab .n{font-size:11.5px;background:var(--coral);color:#fff;border-radius:9px;padding:1px 6px;margin-left:4px}

main{padding-block:16px 80px}

/* общие элементы */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--sea);color:var(--sea-ink);font-weight:800;border-radius:11px;padding:10px 15px;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.danger.sure{background:var(--coral);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.in,select.in,textarea.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);outline:0;min-width:0}
.in:focus{border-color:var(--sea)}
textarea.in{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink)}
label.f small{font-weight:500;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--muted);font-size:13px}
.err{background:var(--coral-soft);color:var(--coral);font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .in{flex:1 1 200px;width:auto}
.toolbar select.in{flex:0 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--body)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* переключатель */
.sw{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:36px;height:21px;border-radius:12px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw i::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(15px)}
.sw input:focus-visible+i{outline:2px solid var(--sea);outline-offset:2px}

/* список товаров */
.grp{margin-bottom:18px}
.grp h3{font-size:15px;margin:0 2px 8px;display:flex;gap:8px;align-items:baseline}
.grp h3 span{font-size:12px;color:var(--muted);font-weight:600}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pr{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr.off{background:color-mix(in srgb,var(--soft) 55%,var(--card))}
.pr.off .ph,.pr.off .nm{opacity:.55}
.ph{width:48px;height:48px;border-radius:9px;background:var(--soft);overflow:hidden;display:grid;place-items:center;font-size:22px}
.ph img{width:100%;height:100%;object-fit:cover}
.nm{min-width:0;cursor:pointer}
.nm b{display:block;color:var(--ink);font-weight:700;line-height:1.25}
.nm small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11px;font-weight:800;border-radius:7px;padding:1px 6px;background:var(--soft);color:var(--body)}
.tag.sale{background:var(--coral-soft);color:var(--coral)}
.tag.ask{background:var(--sea-soft);color:var(--sea)}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 8px 0 4px}
.price input{width:76px;border:0;background:none;outline:0;padding:7px 4px;text-align:right;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.price input::-webkit-inner-spin-button{display:none}
.price span{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.price.saved{border-color:var(--ok)}
.mv{display:flex;gap:2px}
.mv button{width:28px;height:26px;border-radius:7px;color:var(--muted);font-size:13px}
.mv button:hover{background:var(--soft);color:var(--ink)}
.ctl .bot{display:flex;align-items:center;gap:8px}

/* категории */
.cr{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.cr .em{text-align:center;font-size:20px;padding:8px 4px}
.cr .act{display:flex;gap:6px;align-items:center}

/* заказы */
.orders{display:flex;flex-direction:column;gap:12px}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.oc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.oc .top b{font-size:16px;color:var(--ink)}
.oc .top small{display:block;color:var(--muted);font-size:12.5px}
.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:10px;background:var(--coral);color:#fff;white-space:nowrap}
.pill.confirmed,.pill.going{background:var(--sea);color:var(--sea-ink)}
.pill.done{background:var(--ok);color:#fff}
.pill.canceled{background:var(--soft);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{color:var(--ink);overflow-wrap:anywhere}
.lines{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.lines .tot{font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:5px;margin-top:3px}
.oact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.oact .fs{display:flex;gap:6px;align-items:center}
.oact .fs input{width:110px}

/* настройки */
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:640px}

/* подключение */
.conn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin-bottom:16px}
.conn h3{font-size:16px}
.bot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13.5px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--coral)}
.conn a{color:var(--sea);font-weight:700}
.conn .acts{display:flex;gap:8px;flex-wrap:wrap}

/* окно товара */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .ov{position:absolute;inset:0;background:rgba(5,15,20,.5)}
.modal .pan{position:relative;width:100%;max-width:620px;max-height:94vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.modal .pan{border-radius:18px;max-height:90vh}}
.pan h2{font-size:19px;margin-bottom:14px;padding-right:40px}
.pan .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:19px;color:var(--ink)}
.pan form{display:flex;flex-direction:column;gap:14px}
.photo{display:flex;gap:14px;align-items:center}
.photo .ph{width:96px;height:96px;border-radius:14px;font-size:36px}
.photo .b{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.mode{display:flex;flex-direction:column;gap:7px}
.mode label{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.mode label:has(input:checked){border-color:var(--sea);background:var(--sea-soft)}
.mode input{margin-top:3px;accent-color:var(--sea)}
.mode b{display:block;color:var(--ink);font-size:14px}
.mode small{color:var(--muted);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.preview{background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 13px;font-size:13.5px}
.preview b{font-size:15px}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:4px}
.foot .sp{flex:1}

/* акции */
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pcard.off .ban{filter:grayscale(.8);opacity:.6}
.pcard .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.pcard .bd .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ban{position:relative;aspect-ratio:2/1;border-radius:0;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px;cursor:pointer;background:var(--sea)}
.ban img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.6))}
.ban.noimg::after{background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.22),transparent 45%)}
.ban>*:not(img){position:relative;z-index:1}
.ban .bdg{align-self:flex-start;margin-bottom:auto;background:rgba(255,255,255,.92);color:#0E1C26;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:12px;text-transform:uppercase}
.ban h4{font-size:17px;line-height:1.15;font-weight:800}
.ban p{font-size:12px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ban.big{border-radius:14px;aspect-ratio:2/1}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.colors button.on{border-color:var(--card);box-shadow:0 0 0 2px var(--ink)}
/* покупатели */
.cu{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.cu:last-child{border-bottom:0}
.cu b{color:var(--ink)}
.cu small{display:block;color:var(--muted);font-size:12.5px}
.cu .bal{font-weight:800;color:var(--ink);font-size:16px;text-align:right;white-space:nowrap}
.cu .bal small{font-weight:600}
.cu .adj{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bg);border-radius:10px;padding:8px}
.cu .adj .in{width:auto;flex:1 1 120px}
.cu .adj .in.n{flex:0 0 110px}
.hist{grid-column:1/-1;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.hist div{display:flex;justify-content:space-between;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats b{display:block;font-size:22px;color:var(--ink)}
.stats small{color:var(--muted);font-size:12px;font-weight:600}
.form h3{font-size:16px;color:var(--ink)}
.form h3.sec{margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.brandrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brandrow img{border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.brandrow .av{width:84px;height:84px;border-radius:50%;object-fit:cover}
.brandrow .wb{width:220px;aspect-ratio:2/1;object-fit:cover}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all;user-select:all}
/* доставка */
.dz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:900px){.dz{grid-template-columns:1fr}}
#zmap{height:560px;border-radius:14px;border:1px solid var(--line);background:var(--soft);z-index:0}
@media (max-width:900px){#zmap{height:420px}}
.zside{display:flex;flex-direction:column;gap:10px}
.zr{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.zr:last-child{border-bottom:0}
.zr i{width:14px;height:14px;border-radius:4px}
.zr b{color:var(--ink);display:block}
.zr small{color:var(--muted);font-size:12px;display:block}
.zr.off{opacity:.5}
.zf{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.zf .hint{background:var(--sea-soft);color:var(--sea);border-radius:10px;padding:9px 11px;font-size:12.5px;font-weight:600}
.vx{width:14px!important;height:14px!important;margin:-7px 0 0 -7px!important;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:grab}
.vx.first{border-color:var(--coral)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:12px;max-width:90vw;text-align:center}
.toast.bad{background:var(--coral);color:#fff}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
@media (max-width:560px){
  .pr{grid-template-columns:44px minmax(0,1fr);row-gap:8px}
  .pr .ph{width:44px;height:44px}
  .pr .ctl{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .row2{grid-template-columns:1fr}
  .hd small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>

<section class="login" id="login" hidden>
  <form id="loginForm">
    <h1>Seafood Сочи</h1>
    <p>Вход в управление магазином в Telegram и MAX</p>
    <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <div class="err" id="loginErr" hidden></div>
    <button class="btn" type="submit">Войти</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="hd"><b id="brand">Seafood Сочи</b><small>управление магазином</small><span class="sp"></span><a href="/" target="_blank" rel="noopener">Открыть магазин ↗</a><button id="logout" type="button">Выйти</button></div>
      <nav class="tabs" id="tabs">
        <button class="tab on" data-tab="products" type="button">Товары</button>
        <button class="tab" data-tab="cats" type="button">Категории</button>
        <button class="tab" data-tab="orders" type="button">Заказы<span class="n" id="newCount" hidden></span></button>
        <button class="tab" data-tab="promos" type="button">Акции</button>
        <button class="tab" data-tab="zones" type="button">Доставка</button>
        <button class="tab" data-tab="customers" type="button">Покупатели</button>
        <button class="tab" data-tab="settings" type="button">Настройки</button>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section id="t-products"></section>
    <section id="t-cats" hidden></section>
    <section id="t-orders" hidden></section>
    <section id="t-promos" hidden></section>
    <section id="t-zones" hidden></section>
    <section id="t-customers" hidden></section>
    <section id="t-settings" hidden></section>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="ov" data-close></div><div class="pan" id="pan"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file" accept="image/*" hidden>

<script src="/app/pricing.js"></script>
<script src="/static/zones.js"></script>
<script src="/static/leaflet.js"></script>
<script>
(function(){
'use strict';
var P = window.Pricing;
var S = { cats:[], products:[], settings:{}, promos:[], zones:[], defaults:{} };
var ui = { tab:'products', q:'', cid:'', filter:'all', ordersFilter:'active' };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function toast(t,bad){ var el=$('toast'); el.textContent=t; el.className='toast'+(bad?' bad':''); el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){el.hidden=true;},bad?3500:1600); }
function api(path, body){
  return fetch('/admin/api/'+path, body===undefined ? {credentials:'same-origin'} : {method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){ return r.json().catch(function(){return {ok:false,error:'Ошибка сервера'};}).then(function(j){
      if(r.status===401 && path!=='login'){ showLogin(); throw new Error('auth'); }
      if(!j.ok) throw new Error(j.error||'Не получилось');

  if(!st){ el.innerHTML='<h3>Подключение</h3><p class="muted">Проверяем…</p>'; return; }
  el.innerHTML='<h3>Подключение</h3><div class="bot">'+botLine('Telegram',st.tg)+botLine('MAX',st.max)+
    '<span class="muted">Магазин для покупателей</span><span>'+(st.publicUrl?'<a href="'+esc(st.publicUrl)+'" target="_blank" rel="noopener">'+esc(st.publicUrl.replace(/^https:\/\//,''))+'</a>':'не задан')+'</span>'+
    '<span class="muted">Хранилище</span><span>'+(st.storage==='redis'?'Redis (Upstash)':(st.serverless?'<b style="color:var(--coral)">не подключено — подключите Upstash в Vercel: Storage → Upstash, иначе заказы и правки пропадут</b>':'файл на сервере'))+'</span></div>'+
    '<div class="acts"><button class="btn sm" type="button" data-connect>Подключить ботов</button>'+
    (st.externalImages?'<button class="btn ghost sm" type="button" data-import>Перенести фото к себе ('+st.externalImages+')</button>':'')+'</div>'+
    '<p class="muted">«Подключить ботов» привязывает Telegram и MAX к этому адресу и ставит кнопку «Магазин». Нажмите после первого запуска и после смены токена.'+(st.externalImages?' Сейчас '+st.externalImages+' фото берутся по ссылкам с сайта — перенесите их, чтобы магазин не зависел от сайта.':'')+'</p>';
}
function loadConn(){ renderConn(null); api('bots').then(function(st){ renderConn(st); renderRemindInfo(st); }).catch(function(x){ fail(x); }); }

  var el=$('remindInfo'); if(!el) return;

    '<div style="margin-top:8px"><button class="btn ghost sm" type="button" data-remindrun>Проверить корзины сейчас</button></div>'+
    (st.brand?'<p style="margin-top:8px">Оформление бота применено: '+fmtDate(st.brand.at)+'</p>':'');
}

/* ---------- акции ---------- */
var PF=null; // черновик акции
var PCOLORS=['#0E7C86','#E4572E','#1F3A5F','#7A4FB5','#C99A2E','#2E8B57','#0E1C26'];
var LINK_LABELS={none:'Без кнопки',sale:'Экран «Акции»',product:'Товар',category:'Раздел каталога',account:'Личный кабинет (бонусы)',url:'Внешняя ссылка'};
function today(){ return P.today(); }
function promoState(x){
  if(!x.active) return ['скрыта',''];
  var t=today();
  if(x.from && x.from>t) return ['с '+fmtD(x.from),'sale'];
  if(x.to && x.to<t) return ['завершена',''];
  return ['показывается','ask'];
}
function fmtD(s){ return s? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4) : ''; }
function banHtml(x,i,big){
  var col=x.color||PCOLORS[i%PCOLORS.length];
  return '<div class="ban'+(x.image?'':' noimg')+(big?' big':'')+'" style="background:'+esc(col)+'"'+(big?'':' data-pedit="'+esc(x.id)+'"')+'>'+(x.image?'<img src="'+esc(x.image)+'" alt="">':'')+
    (x.badge?'<span class="bdg">'+esc(x.badge)+'</span>':'<span></span>')+'<h4>'+esc(x.title||'Заголовок акции')+'</h4><p>'+esc(x.text||'')+'</p></div>';
}
function renderPromos(){
  var h='<div class="toolbar"><button class="btn" type="button" data-pnew>+ Акция</button><span class="muted">Баннеры в магазине и разделе «Акции» бота. Порядок — как здесь. Скидки на отдельные товары задаются в карточке товара.</span></div>';
  if(!S.promos.length) h+='<div class="empty">Акций пока нет. Нажмите «+ Акция», загрузите картинку и напишите условия.</div>';
  h+='<div class="promos">'+S.promos.map(function(x,i){
    var st=promoState(x);
    return '<div class="pcard'+(st[0]==='показывается'?'':' off')+'">'+banHtml(x,i)+'<div class="bd">'+
      '<div class="tags"><span class="tag '+st[1]+'">'+st[0]+'</span>'+(x.from||x.to?'<span class="tag">'+(x.from?fmtD(x.from):'…')+' — '+(x.to?fmtD(x.to):'…')+'</span>':'')+(x.popup?'<span class="tag sale">всплывает</span>':'')+(x.link_type!=='none'?'<span class="tag">→ '+esc(LINK_LABELS[x.link_type]||'')+'</span>':'')+'</div>'+
      '<div class="r"><label class="sw"><input type="checkbox" data-pact="'+esc(x.id)+'"'+(x.active?' checked':'')+'><i></i>'+(x.active?'включена':'выключена')+'</label>'+
      '<span class="mv"><button type="button" data-pmove="'+esc(x.id)+'" data-dir="-1" aria-label="Выше">▲</button><button type="button" data-pmove="'+esc(x.id)+'" data-dir="1" aria-label="Ниже">▼</button></span>'+
      '<button class="btn ghost sm" type="button" data-pedit="'+esc(x.id)+'">Изменить</button></div></div></div>';
  }).join('')+'</div>';
  $('t-promos').innerHTML=h;
}
function openPromo(id){
  var x=id?S.promos.find(function(y){return y.id===id;}):null;
  PF=Object.assign({id:'',title:'',text:'',badge:'',image:'',btn:'',link_type:'none',link_id:'',color:'',from:'',to:'',active:1,popup:0}, x||{});
  PF._sure=false; PF._i=x?S.promos.indexOf(x):S.promos.length;
  drawPromo(); $('modal').hidden=false; document.body.style.overflow='hidden';
}

  if(lt==='category') target='<label class="f">Какой раздел открыть<select class="in" data-pf="link_id"><option value="">— выберите —</option>'+S.cats.map(function(c){return '<option value="'+c.cid+'"'+(c.cid===f.link_id?' selected':'')+'>'+c.emoji+' '+esc(c.name)+'</option>';}).join('')+'</select></label>';
  if(lt==='url') target='<label class="f">Ссылка<input class="in" data-pf="link_id" value="'+esc(f.link_id)+'" placeholder="https://"></label>';
  $('pan').innerHTML='<button class="x" type="button" data-close aria-label="Закрыть">×</button><h2>'+(f.id?'Акция':'Новая акция')+'</h2>'+
  '<form id="prf" novalidate>'+
  '<div id="pprev">'+banHtml(f,f._i,true)+'</div>'+
  '<div class="toolbar" style="margin:0"><button class="btn ghost sm" type="button" data-photo="promo">'+(f.image?'Заменить картинку':'Загрузить картинку')+'</button>'+(f.image?'<button class="btn ghost sm" type="button" data-pnophoto>Убрать картинку</button>':'')+'<span class="muted">Горизонтальная, примерно 2:1 (например 1200×600). Без картинки — цветной фон.</span></div>'+
  (f.image?'':'<div class="f" style="display:flex;flex-direction:column;gap:6px"><b style="font-size:13px;color:var(--ink)">Цвет фона</b><div class="colors">'+PCOLORS.map(function(c,i){ var on=(f.color||PCOLORS[f._i%PCOLORS.length])===c; return '<button type="button" data-pcolor="'+c+'" class="'+(on?'on':'')+'" style="background:'+c+'" aria-label="Цвет '+(i+1)+'"></button>'; }).join('')+'</div></div>')+
  '<label class="f">Заголовок<input class="in" id="pf-title" data-pf="title" maxlength="80" value="'+esc(f.title)+'" placeholder="Скидка 15% на креветки"></label>'+
  '<label class="f">Условия <small>— видно в окне акции</small><textarea class="in" data-pf="text" maxlength="600" placeholder="До воскресенья все креветки со скидкой 15%. Количество ограничено.">'+esc(f.text)+'</textarea></label>'+
  '<div class="row2"><label class="f">Ярлык <small>необязательно</small><input class="in" data-pf="badge" maxlength="24" value="'+esc(f.badge)+'" placeholder="−15%"></label>'+
  '<label class="f">Текст кнопки <small>необязательно</small><input class="in" data-pf="btn" maxlength="30" value="'+esc(f.btn)+'" placeholder="Выбрать креветки"></label></div>'+
  '<label class="f">Кнопка ведёт<select class="in" data-pf="link_type">'+Object.keys(LINK_LABELS).map(function(k){return '<option value="'+k+'"'+(k===lt?' selected':'')+'>'+LINK_LABELS[k]+'</option>';}).join('')+'</select></label>'+target+
  '<div class="row2"><label class="f">Показывать с <small>пусто — сразу</small><input class="in" type="date" data-pf="from" value="'+esc(f.from)+'"></label><label class="f">По <small>включительно; пусто — бессрочно</small><input class="in" type="date" data-pf="to" value="'+esc(f.to)+'"></label></div>'+
  '<label class="sw"><input type="checkbox" data-pfc="active"'+(f.active?' checked':'')+'><i></i><span style="color:var(--ink);font-size:13.5px">Включена — показывать покупателям</span></label>'+
  '<label class="sw"><input type="checkbox" data-pfc="popup"'+(f.popup?' checked':'')+'><i></i><span style="color:var(--ink);font-size:13.5px">Всплывающее окно при входе в магазин (один раз для каждого покупателя)</span></label>'+
  '<div class="err" id="prerr" hidden></div>'+
  '<div class="foot"><button class="btn" type="submit">Сохранить</button><button class="btn ghost" type="button" data-close>Отмена</button><span class="sp"></span>'+
  (f.id?'<button class="btn danger'+(f._sure?' sure':'')+'" type="button" data-pdel>'+(f._sure?'Точно удалить?':'Удалить')+'</button>':'')+'</div></form>';
}
$('pan').addEventListener('input',function(e){
  if(!PF) return; var k=e.target.dataset.pf; if(!k) return;
  PF[k]=e.target.value; if(['title','text','badge'].indexOf(k)!==-1) $('pprev').innerHTML=banHtml(PF,PF._i,true);
});
$('pan').addEventListener('change',function(e){
  if(!PF) return; var t=e.target;
  if(t.dataset.pfc){ PF[t.dataset.pfc]=t.checked?1:0; return; }
  if(t.dataset.pf==='link_type'){ PF.link_type=t.value; PF.link_id=''; return drawPromo(); }
  if(t.dataset.pf) PF[t.dataset.pf]=t.value;
});
$('pan').addEventListener('submit',function(e){
  if(!PF || !$('prf')) return; e.preventDefault();
  var err=$('prerr'); err.hidden=true;
  var x={}; ['id','title','text','badge','image','btn','link_type','link_id','color','from','to','active','popup'].forEach(function(k){ x[k]=PF[k]; });
  if(!String(x.title).trim()){ err.textContent='Укажите заголовок'; err.hidden=false; return; }
  api('promo/save',{promo:x}).then(function(){ closeModal(); toast(x.id?'Акция сохранена':'Акция добавлена'); renderPromos(); })
    .catch(function(y){ if(y.message==='auth') return; err.textContent=y.message; err.hidden=false; });
});
$('t-promos').addEventListener('change',function(e){
  var id=e.target.dataset.pact; if(!id) return;
  var x=S.promos.find(function(y){return y.id===id;}); if(!x) return;
  api('promo/save',{promo:Object.assign({},x,{active:e.target.checked?1:0})}).then(function(){ toast(e.target.checked?'Акция включена':'Акция скрыта'); renderPromos(); }).catch(function(y){ fail(y); renderPromos(); });
});

/* ---------- зоны доставки ---------- */
var ZMAP=null, ZLAYER=null, ZF=null, ZCOLORS=['#2E9E5B','#E0B12E','#E4772E','#D64545','#2F6FCB','#7A4FB5'];
function renderZones(){
  var el=$('t-zones');
  if(!$('zmap')){
    el.innerHTML='<div class="toolbar"><button class="btn" type="button" data-znew>+ Зона</button><span class="muted">Цветные зоны и тарифы видны покупателям на карте в магазине. Стоимость доставки считается по точке адреса автоматически.</span></div>'+
      '<div class="dz"><div id="zmap"></div><div class="zside" id="zside"></div></div>';
    ZMAP=L.map('zmap',{zoomControl:true}).setView([43.58,39.85],10);
    L.tileLayer('/tiles/{z}/{x}/{y}.png?v=osm',{maxZoom:18,minZoom:8,attribution:'© OpenStreetMap'}).addTo(ZMAP);
    ZLAYER=L.layerGroup().addTo(ZMAP);
    ZMAP.on('click',function(e){ if(!ZF) return; ZF.polygon.push([+e.latlng.lat.toFixed(5),+e.latlng.lng.toFixed(5)]); drawEditing(); });
  } else setTimeout(function(){ ZMAP.invalidateSize(); },50);
  drawZoneSide(); drawZones();
}
function drawZones(){
  ZLAYER.clearLayers();
  S.zones.forEach(function(z){
    if(ZF && ZF.id===z.id) return;
    if(!z.polygon||z.polygon.length<3) return;
    L.polygon(z.polygon,{color:z.color,weight:2,fillOpacity:z.active?0.28:0.08,dashArray:z.active?null:'4 4'}).addTo(ZLAYER).bindTooltip(esc(z.name)).on('click',function(ev){ if(ZF) return; L.DomEvent.stop(ev); editZone(z.id); });
  });
  if(ZF) drawEditing();
}
var ZEDIT=null;
function drawEditing(){
  if(ZEDIT) ZEDIT.remove();
  ZEDIT=L.layerGroup().addTo(ZMAP);
  if(ZF.polygon.length>=2) L.polygon(ZF.polygon,{color:ZF.color,weight:3,fillOpacity:0.35}).addTo(ZEDIT);
  ZF.polygon.forEach(function(p,i){
    var m=L.marker(p,{draggable:true,icon:L.divIcon({className:'vx'+(i===0?' first':''),iconSize:[14,14]})}).addTo(ZEDIT);
    m.on('dragend',function(){ var ll=m.getLatLng(); ZF.polygon[i]=[+ll.lat.toFixed(5),+ll.lng.toFixed(5)]; drawEditing(); });
    m.on('contextmenu dblclick',function(ev){ L.DomEvent.stop(ev); ZF.polygon.splice(i,1); drawEditing(); });
  });
  var n=$('zpts'); if(n) n.textContent=ZF.polygon.length;
}
function zoneLine(z){ return (window.Zones?Zones.tariff(z):'')+(z.eta?' · '+z.eta:''); }
function drawZoneSide(){
  var side=$('zside'); if(!side) return;
  if(!ZF){
    if(ZEDIT){ ZEDIT.remove(); ZEDIT=null; }
    var strict=S.settings.zone_strict==='1';
    side.innerHTML=(S.zones.length?'<div class="list">'+S.zones.map(function(z){
      return '<div class="zr'+(z.active?'':' off')+'" data-zedit="'+esc(z.id)+'"><i style="background:'+esc(z.color)+'"></i><div><b>'+esc(z.name)+'</b><small>'+esc(zoneLine(z))+'</small></div>'+
        '<span class="mv"><button type="button" data-zmove="'+esc(z.id)+'" data-dir="-1" aria-label="Выше">▲</button><button type="button" data-zmove="'+esc(z.id)+'" data-dir="1" aria-label="Ниже">▼</button></span></div>';
    }).join('')+'</div>':'<div class="empty">Зон пока нет. Нажмите «+ Зона» и обведите район на карте.</div>')+
    '<label class="sw"><input type="checkbox" id="zstrict"'+(strict?' checked':'')+'><i></i><span style="color:var(--ink);font-size:13px">Не принимать заказы вне зон</span></label>'+
    '<p class="muted">Если зоны пересекаются, действует верхняя в списке. Без отметки заказ вне зон всё равно придёт — с пометкой, что условия доставки надо согласовать.</p>';
    drawZones(); return;
  }
  var f=ZF;
  side.innerHTML='<div class="zf"><b style="color:var(--ink)">'+(f.id?'Зона':'Новая зона')+'</b>'+
    '<div class="hint">Нажимайте на карту, чтобы обвести район. Точки можно перетаскивать; двойной клик по точке — удалить. Точек: <span id="zpts">'+f.polygon.length+'</span></div>'+
    '<label class="f">Название<input class="in" data-zf="name" value="'+esc(f.name)+'" maxlength="60" placeholder="Центр Сочи"></label>'+
    '<div class="f" style="display:flex;flex-direction:column;gap:6px"><b style="font-size:13px;color:var(--ink)">Цвет</b><div class="colors">'+ZCOLORS.map(function(c){return '<button type="button" data-zcolor="'+c+'" class="'+(c===f.color?'on':'')+'" style="background:'+c+'"></button>';}).join('')+'</div></div>'+
    '<div class="row2"><label class="f">Доставка, ₽ <small>0 — бесплатно</small><input class="in" type="number" min="0" data-zf="price" value="'+(+f.price||0)+'"></label>'+
    '<label class="f">Бесплатно от, ₽ <small>0 — без порога</small><input class="in" type="number" min="0" data-zf="free_from" value="'+(+f.free_from||0)+'"></label>'+
    '<label class="f">Мин. заказ, ₽ <small>0 — общий</small><input class="in" type="number" min="0" data-zf="min_order" value="'+(+f.min_order||0)+'"></label>'+
    '<label class="f">Срок <small>необязательно</small><input class="in" data-zf="eta" maxlength="60" value="'+esc(f.eta)+'" placeholder="2–4 часа"></label></div>'+
    '<label class="sw"><input type="checkbox" data-zfc="active"'+(f.active?' checked':'')+'><i></i><span style="color:var(--ink);font-size:13px">Зона действует</span></label>'+
    '<div class="err" id="zerr" hidden></div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" type="button" id="zsave">Сохранить</button><button class="btn ghost sm" type="button" data-zundo>Отменить точку</button><button class="btn ghost sm" type="button" data-zclear>Очистить контур</button><button class="btn ghost sm" type="button" data-zcancel>Закрыть</button>'+
    (f.id?'<button class="btn danger sm'+(f._sure?' sure':'')+'" type="button" data-zdel>'+(f._sure?'Точно удалить?':'Удалить')+'</button>':'')+'</div></div>';
  drawZones();
}
function editZone(id){
  var z=id?S.zones.find(function(x){return x.id===id;}):null;
  ZF=JSON.parse(JSON.stringify(Object.assign({id:'',name:'',color:ZCOLORS[S.zones.length%ZCOLORS.length],price:300,free_from:0,min_order:0,eta:'',polygon:[],active:1},z||{})));
  drawZoneSide();
  if(z&&z.polygon.length) ZMAP.fitBounds(L.polygon(z.polygon).getBounds(),{padding:[30,30]});
}
$('t-zones').addEventListener('input',function(e){ if(ZF && e.target.dataset.zf) ZF[e.target.dataset.zf]=e.target.value; });
$('t-zones').addEventListener('change',function(e){
  if(ZF && e.target.dataset.zfc) ZF[e.target.dataset.zfc]=e.target.checked?1:0;
  if(e.target.id==='zstrict') api('settings/save',{settings:{zone_strict:e.target.checked?'1':'0'}}).then(function(){ toast(e.target.checked?'Заказы вне зон не принимаются':'Заказы вне зон принимаются с пометкой'); }).catch(fail);
});
$('t-zones').addEventListener('click',function(e){
  if(e.target.id!=='zsave') return;
  var err=$('zerr'); err.hidden=true;
  var z={}; ['id','name','color','price','free_from','min_order','eta','polygon','active'].forEach(function(k){ z[k]=ZF[k]; });
  api('zone/save',{zone:z}).then(function(){ ZF=null; toast('Зона сохранена'); renderZones(); }).catch(function(x){ if(x.message==='auth') return; err.textContent=x.message; err.hidden=false; });
});

/* ---------- покупатели ---------- */
var CUS=[], cq='', openHist={};
function loadCustomers(){
  $('t-customers').innerHTML='<div class="empty">Загружаем…</div>';
  api('customers').then(function(j){ CUS=j.customers; renderCustomers(); }).catch(fail);
}
function renderCustomers(){
  var el=$('t-customers'), focus=document.activeElement && document.activeElement.id==='cq';
  var list=CUS.filter(function(c){ if(!cq) return true; return (c.name+' '+c.username+' '+c.phone+' '+c.refCode).toLowerCase().indexOf(cq)!==-1; });
  var buyers=CUS.filter(function(c){return c.orders>0;}).length, bonus=CUS.reduce(function(s,c){return s+c.balance;},0), refs=CUS.filter(function(c){return c.referred;}).length;
  var h='<div class="stats"><div><b>'+CUS.length+'</b><small>открывали бота</small></div><div><b>'+buyers+'</b><small>сделали заказ</small></div><div><b>'+refs+'</b><small>пришли по приглашению</small></div><div><b>'+P.ru(bonus)+'</b><small>бонусов на счетах</small></div></div>'+
    '<div class="toolbar"><input class="in" id="cq" type="search" placeholder="Имя, @ник, телефон или код" value="'+esc(cq)+'"><button class="btn ghost sm" type="button" data-creload>Обновить</button></div>';
  if(!list.length) h+='<div class="empty">'+(CUS.length?'Никого не нашли':'Покупателей пока нет — они появятся, когда откроют бота')+'</div>';
  else h+='<div class="list">'+list.slice(0,300).map(function(c){
    var hist=openHist[c.key];
    return '<div class="cu"><div><b>'+esc(c.name||'Без имени')+'</b>'+(c.username?' <span class="muted">@'+esc(c.username)+'</span>':'')+
      '<small>'+(c.platform==='tg'?'Telegram':'MAX')+(c.phone?' · '+esc(c.phone):'')+' · заказов: '+c.orders+(c.refCount?' · пригласил: '+c.refCount:'')+(c.referred?' · по приглашению':'')+(c.refCode?' · код '+esc(c.refCode):'')+'</small></div>'+
      '<div class="bal">'+c.balance+' <small>💎</small></div>'+
      '<div class="adj"><input class="in n" type="number" inputmode="numeric" placeholder="+200 / −200" data-camt="'+esc(c.key)+'"><input class="in" placeholder="Причина (увидит покупатель)" maxlength="120" data-crsn="'+esc(c.key)+'"><button class="btn sm" type="button" data-cbonus="'+esc(c.key)+'">Начислить / списать</button><button class="btn ghost sm" type="button" data-chist="'+esc(c.key)+'">'+(hist?'Скрыть историю':'История')+'</button></div>'+
      (hist?'<div class="hist">'+(hist.length?hist.map(function(x){return '<div><span>'+fmtDate(x.at)+' · '+esc(x.reason)+'</span><b style="color:'+(x.amount>0?'var(--ok)':'var(--coral)')+'">'+(x.amount>0?'+':'')+x.amount+'</b></div>';}).join(''):'<span class="muted">Операций пока не было</span>')+'</div>':'')+
      '</div>';
  }).join('')+'</div>';
  el.innerHTML=h;
  if(focus){ var q=$('cq'); q.focus(); q.setSelectionRange(q.value.length,q.value.length); }
}
document.addEventListener('input',function(e){ if(e.target.id==='cq'){ cq=e.target.value.trim().toLowerCase(); renderCustomers(); } });

function brandToast(r){
  var bad=[]; ['tg','max'].forEach(function(k){ var x=r&&r[k]; if(!x) return; if(x.error) bad.push((k==='tg'?'Telegram':'MAX')+': '+x.error); else Object.keys(x).forEach(function(f){ if(x[f]!==true && f!=='photo') bad.push((k==='tg'?'Telegram':'MAX')+' '+f+': '+x[f]); if(f==='photo'&&x[f]!==true&&x[f]!==false) bad.push((k==='tg'?'Telegram':'MAX')+' аватар: '+x[f]); }); });
  toast(bad.length?bad.join('; '):'Готово: оформление применено', !!bad.length);
}

/* ---------- фото ---------- */
var photoTarget=null;
function resize(file,max,q){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      var c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      var ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('Не удалось открыть фото. Попробуйте JPG или PNG.')); };
    img.src=url;
  });
}
$('file').addEventListener('change',function(){
  var file=this.files[0]; this.value=''; if(!file) return;
  toast('Загружаем фото…');
  Promise.all([resize(file,1200,.85),resize(file,360,.8)]).then(function(r){ return api('upload',{full:r[0],thumb:r[1]}); })
    .then(function(j){
      if(photoTarget==='product' && F){ F.image=j.image; drawProduct(); toast('Фото загружено — не забудьте сохранить'); }
      if(photoTarget==='promo' && PF){ PF.image=j.image; drawPromo(); toast('Картинка загружена — не забудьте сохранить'); }
      if(photoTarget==='welcome'){ $('welcome_image').value=j.image; $('wbImg').src=j.image; toast('Картинка загружена — нажмите «Сохранить»'); }
      if(photoTarget==='avatar'){ toast('Ставим аватар…'); api('bot/brand',{avatar:j.image,photo:true}).then(function(r){ S._avatar=j.image; $('avImg').src=j.image; brandToast(r.result); }).catch(fail); }
    }).catch(fail);
});

/* ---------- клики ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-edit],[data-pedit],[data-zedit],[data-close]'); if(!t) return; var d=t.dataset;
  if(d.close!==undefined) return closeModal();
  if(d.new!==undefined) return openProduct(0);
  if(d.edit) return openProduct(d.edit);
  if(d.filter){ ui.filter=d.filter; return renderProducts(); }
  if(d.move) return api('product/move',{id:+d.move,dir:+d.dir}).then(renderProducts).catch(fail);
  if(d.photo){ photoTarget=d.photo; return $('file').click(); }
  if(d.nophoto!==undefined){ F.image=''; return drawProduct(); }
  if(d.pnew!==undefined) return openPromo('');
  if(d.pedit) return openPromo(d.pedit);
  if(d.pnophoto!==undefined){ PF.image=''; return drawPromo(); }
  if(d.pcolor){ PF.color=d.pcolor; return drawPromo(); }
  if(d.pmove) return api('promo/move',{id:d.pmove,dir:+d.dir}).then(renderPromos).catch(fail);
  if(d.pdel!==undefined){
    if(!PF._sure){ PF._sure=true; drawPromo(); setTimeout(function(){ if(PF){PF._sure=false; drawPromo();} },4000); return; }
    return api('promo/delete',{id:PF.id}).then(function(){ closeModal(); toast('Акция удалена'); renderPromos(); }).catch(fail);
  }
  if(d.creload!==undefined) return loadCustomers();
  if(d.avdefault!==undefined){ return api('bot/brand',{avatar:'',photo:true}).then(function(r){ S._avatar=''; $('avImg').src='/static/avatar.jpg'; brandToast(r.result); }).catch(fail); }
  if(d.wbdefault!==undefined){ $('welcome_image').value=''; $('wbImg').src='/static/welcome.jpg'; return toast('Нажмите «Сохранить», чтобы вернуть стандартную картинку'); }
  if(d.brand!==undefined){
    var data={}; new FormData($('sf')).forEach(function(v,k){ data[k]=v; }); t.disabled=true;
    return api('settings/save',{settings:data}).then(function(){ return api('bot/brand',{}); }).then(function(r){ t.disabled=false; brandToast(r.result); }).catch(function(x){ t.disabled=false; fail(x); });
  }
  if(d.remindrun!==undefined) return api('reminders/run',{force:true}).then(function(r){ toast(r.skipped?'Напоминания '+r.skipped:'Отправлено напоминаний: '+r.sent+(r.waiting?', ждут своего часа: '+r.waiting:'')); }).catch(fail);
  if(d.znew!==undefined) return editZone(null);
  if(d.zedit) return editZone(d.zedit);
  if(d.zcancel!==undefined){ ZF=null; return drawZoneSide(); }
  if(d.zundo!==undefined){ ZF.polygon.pop(); return drawEditing(); }
  if(d.zclear!==undefined){ ZF.polygon=[]; return drawEditing(); }
  if(d.zmove) return api('zone/move',{id:d.zmove,dir:+d.dir}).then(renderZones).catch(fail);
  if(d.zcolor){ ZF.color=d.zcolor; drawZoneSide(); return drawEditing(); }
  if(d.zdel!==undefined){
    if(!ZF._sure){ ZF._sure=true; drawZoneSide(); return; }
    return api('zone/delete',{id:ZF.id}).then(function(){ ZF=null; toast('Зона удалена'); renderZones(); }).catch(fail);
  }
  if(d.chist){ if(openHist[d.chist]){ delete openHist[d.chist]; return renderCustomers(); } return api('customer?key='+encodeURIComponent(d.chist)).then(function(j){ openHist[d.chist]=j.history; renderCustomers(); }).catch(fail); }
  if(d.cbonus){
    var amt=document.querySelector('[data-camt="'+d.cbonus+'"]').value, rsn=document.querySelector('[data-crsn="'+d.cbonus+'"]').value;
    if(!(+amt)) return toast('Введите количество, например 200 или -200',true);
    t.disabled=true;
    return api('customer/bonus',{key:d.cbonus,amount:+amt,reason:rsn}).then(function(j){ CUS=j.customers; delete openHist[d.cbonus]; toast('Готово, на счёте '+j.balance+' — покупатель уведомлён'); renderCustomers(); }).catch(function(x){ t.disabled=false; fail(x); });
  }
  if(d.del!==undefined){
    if(!F._sure){ F._sure=true; drawProduct(); setTimeout(function(){ if(F){F._sure=false; drawProduct();} },4000); return; }
    return api('product/delete',{id:F.id}).then(function(){ closeModal(); toast('Товар удалён'); renderProducts(); }).catch(fail);
  }
  if(d.newcat!==undefined){
    return api('category/save',{category:{name:'Новая категория',emoji:'🐟'}}).then(function(){ renderCats(); var rows=document.querySelectorAll('[data-cname]'); var last=rows[rows.length-1]; if(last){ last.focus(); last.select(); } }).catch(fail);
  }
  if(d.cmove) return api('category/move',{cid:d.cmove,dir:+d.dir}).then(renderCats).catch(fail);
  if(d.cdel){
    if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Точно?'; t.classList.add('sure'); return; }
    return api('category/delete',{cid:d.cdel}).then(function(){ toast('Категория удалена'); renderCats(); }).catch(fail);
  }
  if(d.connect!==undefined){ t.disabled=true; t.textContent='Подключаем…';
    return api('bots/connect',{}).then(function(j){ var e=Object.keys(j.errors||{}).map(function(k){return (k==='tg'?'Telegram':'MAX')+': '+j.errors[k];}); if(e.length) toast(e.join('; '),true); else toast('Боты подключены'); renderConn(j); }).catch(function(x){ fail(x); loadConn(); }); }
  if(d.import!==undefined){ t.disabled=true; t.textContent='Переносим… это до минуты';
    return api('images/import',{}).then(function(j){ toast('Перенесено: '+j.ok+(j.failed?', не удалось: '+j.failed:'')+(j.left?', осталось: '+j.left+' — нажмите ещё раз':''), !!j.failed); loadConn(); }).catch(function(x){ fail(x); loadConn(); }); }
  if(d.ofilter){ ui.ordersFilter=d.ofilter; return loadOrders(); }
  if(d.oreload!==undefined) return loadOrders();
  if(d.ost) return api('order/status',{id:+d.ost,status:d.st}).then(function(){ toast('Статус изменён, покупатель уведомлён'); loadOrders(); }).catch(fail);
  if(d.osend){
    var v=document.querySelector('[data-osum="'+d.osend+'"]').value;
    return api('order/sum',{id:+d.osend,sum:+v}).then(function(){ toast('Итог отправлен покупателю'); loadOrders(); }).catch(fail);
  }
});

/* ---------- запуск ---------- */
function boot(){
  api('state').then(function(){ $('login').hidden=true; $('app').hidden=false; render();
    api('orders?filter=active').then(function(j){ var n=j.orders.filter(function(o){return o.status==='new';}).length; $('newCount').textContent=n; $('newCount').hidden=!n; }).catch(function(){});
  }).catch(function(x){ if(x.message!=='auth'){ document.body.innerHTML='<div class="empty">'+esc(x.message)+'</div>'; } });
}
boot();
})();
</script>
</body>
