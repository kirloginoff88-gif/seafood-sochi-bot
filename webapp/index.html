<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seafood Сочи — магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Фирменные цвета seafood-sochi.ru: морская бирюза + коралл */
:root{
  --bg:#F3F1EC; --card:#fff; --soft:#EAE5DC; --ink:#0E1C26; --body:#3A4A55; --muted:#7E8A93; --line:#E4DED4;
  --sea:#0E7C86; --sea2:#0A5E66; --sea-soft:#E1F1F2; --sea-ink:#fff; --coral:#E4572E; --coral2:#C8461F; --coral-soft:#FDEDE7;
  --gold:#C99A2E; --ok:#1E8A4C; --shadow:0 6px 22px rgba(14,28,38,.08);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabh:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D171D; --card:#15232B; --soft:#1E2F38; --ink:#EEF3F5; --body:#C6D2D8; --muted:#8A9AA3; --line:#24343D;
  --sea:#3FB3BD; --sea2:#2B8F98; --sea-soft:#14343A; --sea-ink:#06262A; --coral:#F07A55; --coral2:#F59373; --coral-soft:#3A2219; --ok:#4CC27E;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D171D; --card:#15232B; --soft:#1E2F38; --ink:#EEF3F5; --body:#C6D2D8; --muted:#8A9AA3; --line:#24343D;
  --sea:#3FB3BD; --sea2:#2B8F98; --sea-soft:#14343A; --sea-ink:#06262A; --coral:#F07A55; --coral2:#F59373; --coral-soft:#3A2219; --ok:#4CC27E;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:var(--font);color:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{max-width:560px;margin:0 auto}
[hidden]{display:none!important}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 16px;scroll-padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}

/* шапка */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 16px 8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo i{flex:0 0 38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--sea),var(--sea2));display:grid;place-items:center;font-style:normal;font-size:20px;box-shadow:0 4px 12px rgba(14,124,134,.3)}
.logo b{display:block;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.bchip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 11px 6px 8px;font-weight:800;font-size:14px;color:var(--ink);box-shadow:var(--shadow)}
.bchip span{font-size:15px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;padding:11px 2px;font-size:15px;color:var(--ink)}
.search .x{font-size:20px;color:var(--muted);padding:4px}
.pills{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--body);background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:20px;white-space:nowrap}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.hot{background:var(--coral-soft);border-color:transparent;color:var(--coral2)}

/* баннеры акций */
.promos{padding-top:6px}
.promo{position:relative;flex:0 0 calc(100% - 32px);scroll-snap-align:start;aspect-ratio:2/1;border-radius:20px;overflow:hidden;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;background:var(--sea);box-shadow:var(--shadow)}
.promo:only-child{flex-basis:100%}
.promo .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 25%,rgba(0,0,0,.62))}
.promo.noimg::after{background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.22),transparent 45%),radial-gradient(circle at 10% 110%,rgba(0,0,0,.25),transparent 55%)}
.promo .deco{position:absolute;right:10px;top:4px;font-size:84px;opacity:.28;transform:rotate(-12deg);z-index:1}
.promo>*:not(.bgimg):not(.deco){position:relative;z-index:2}
.promo .bdg{align-self:flex-start;background:rgba(255,255,255,.92);color:var(--ink);font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;margin-bottom:auto;text-transform:uppercase;letter-spacing:.3px}
.promo h3{font-size:20px;font-weight:800;line-height:1.15;letter-spacing:-.3px;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.promo p{font-size:12.5px;opacity:.92;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:34ch}
.promo .till{font-size:11px;font-weight:700;opacity:.85;margin-top:6px}
.dots{display:flex;justify-content:center;gap:6px;padding:9px 0 0}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--sea)}

/* разделы-плитки */
.blk{padding:20px 0 0}
.blk>h2,.sec h2{font-size:19px;font-weight:800;color:var(--ink);display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 16px 11px;letter-spacing:-.3px}
.blk>h2 button,.sec h2 span{font-size:13px;font-weight:700;color:var(--sea)}
.sec h2 span{color:var(--muted);font-weight:600}
.tiles{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:104px;gap:10px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{position:relative;height:96px;border-radius:16px;overflow:hidden;background:var(--soft);display:flex;align-items:flex-end;padding:8px;text-align:left}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.6))}
.tile.noimg::after{display:none}
.tile .em{position:absolute;top:8px;left:9px;font-size:26px}
.tile b{position:relative;z-index:1;font-size:12.5px;font-weight:800;line-height:1.15;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.tile.noimg b{color:var(--ink);text-shadow:none}

/* бонусная плашка на главной */
.bonusband{margin:18px 16px 0;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:linear-gradient(120deg,var(--ink),#20394A);color:#fff;text-align:left;width:calc(100% - 32px)}
:root[data-theme="dark"] .bonusband{background:linear-gradient(120deg,#1E3A47,#14262F)}
.bonusband .ic{font-size:26px}
.bonusband b{display:block;font-size:14.5px;font-weight:800}
.bonusband small{display:block;font-size:12px;opacity:.8}
.bonusband .ar{margin-left:auto;font-size:20px;opacity:.7}

/* товары */
.sec{padding:22px 0 0;scroll-margin-top:128px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.pc{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;min-width:0}
.pc .ph{position:relative;aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;font-size:44px;overflow:hidden}
.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .in{padding:9px 11px 11px;display:flex;flex-direction:column;flex:1}
.pc .nm{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pc .nt{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pc .pr{margin-top:auto;padding-top:6px;font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 5px}
.pc .pr u{text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted)}
.pc .pr s{font-size:12px;color:var(--muted);font-weight:600}
.pc.sale .pr{color:var(--coral2)}
.pc .ctl{margin-top:8px}
.badge{position:absolute;top:8px;left:8px;z-index:2;background:var(--coral);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:10px}
.hint{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{width:100%;background:var(--sea);color:var(--sea-ink);font-weight:800;font-size:13.5px;padding:9px 6px;border-radius:12px}
.req{display:block;width:100%;text-align:center;font-size:12.5px;font-weight:700;color:var(--sea);border:1.5px dashed var(--sea);padding:7px 6px;border-radius:12px}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--sea-soft);border-radius:12px;overflow:hidden;width:100%}
.step button{width:36px;height:36px;color:var(--sea);font-size:20px;font-weight:800;line-height:1;flex:0 0 auto}
.step span{flex:1;text-align:center;font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.step.sm{width:auto;min-width:120px}
.hot .pc{flex:0 0 150px;scroll-snap-align:start}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);padding:18px 16px 0}

/* нижнее меню */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tab .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.75}
.tab.on{color:var(--sea)}
.tab.on .ic{filter:none;opacity:1}
.tab .cnt{position:absolute;top:6px;left:calc(50% + 6px);background:var(--coral);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* кнопка действия над меню */
.bar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 12px 10px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.bar button{width:100%;max-width:536px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--coral);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 10px 26px rgba(228,87,46,.35)}
.bar button:disabled{background:var(--muted);box-shadow:none;opacity:.85}
.bar button>div{text-align:left}
.bar small{display:block;font-size:11.5px;opacity:.92;font-weight:600}
.bar b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.bar .go{font-weight:800;font-size:15px;white-space:nowrap}

/* экраны */
.view{padding:16px 16px 0}
.view h1{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.4px;margin-bottom:14px}
.view h2{font-size:17px;font-weight:800;color:var(--ink);margin:22px 2px 10px;letter-spacing:-.2px}
.card{background:var(--card);border-radius:18px;padding:4px 14px;box-shadow:var(--shadow)}
.ci{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci .th{flex:0 0 48px;width:48px;height:48px;border-radius:12px;background:var(--soft);overflow:hidden;display:grid;place-items:center;font-size:22px}
.ci .th img{width:100%;height:100%;object-fit:cover}
.ci .i{flex:1;min-width:0}
.ci b{display:block;font-size:13.5px;color:var(--ink);font-weight:700;line-height:1.25}
.ci small{font-size:12px;color:var(--muted)}
.ci .s{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.ci .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ci .step{width:118px}
.ci .step button{width:32px;height:30px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 2px}
.tot b{font-size:14px;color:var(--body);font-weight:600}
.tot strong{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.tot.big b{font-size:16px;color:var(--ink);font-weight:800}
.tot.big strong{font-size:26px}
.tot.bon strong{color:var(--ok)}
.warn{background:var(--coral-soft);color:var(--coral2);font-weight:600;font-size:13px;border-radius:12px;padding:10px 12px;margin-top:10px}
.muted{font-size:12.5px;color:var(--muted);margin:6px 2px}
.link{color:var(--sea);font-weight:700;font-size:13.5px;padding:10px 2px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label{font-size:13px;font-weight:700;color:var(--ink)}
.f input,.f textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;font-size:15px;color:var(--ink);outline:0}
.f input:focus,.f textarea:focus{border-color:var(--sea)}
.f textarea{min-height:76px;resize:vertical}
.f .err{font-size:12.5px;color:var(--coral2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--body)}
.chip.on{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(120deg,var(--sea-soft),var(--card));border:1.5px solid var(--sea);border-radius:16px;padding:13px 14px;margin-bottom:14px}
.toggle .ic{font-size:24px}
.toggle b{display:block;font-size:14.5px;color:var(--ink);font-weight:800}
.toggle small{display:block;font-size:12px;color:var(--muted)}
.sw{margin-left:auto;flex:0 0 44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on .sw{background:var(--sea)}
.toggle.on .sw::after{transform:translateX(18px)}
.done{text-align:center;padding:40px 8px}
.done .big{width:84px;height:84px;margin:0 auto;border-radius:50%;background:var(--sea-soft);display:grid;place-items:center;font-size:42px}
.done h1{margin:16px 0 8px}
.done p{color:var(--muted);max-width:34ch;margin:0 auto 14px}
.done .earn{display:inline-block;background:var(--coral-soft);color:var(--coral2);font-weight:700;font-size:13px;border-radius:12px;padding:8px 12px;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--sea);color:var(--sea-ink);font-weight:800;border-radius:14px;padding:13px 20px}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.w{width:100%}

/* акции: полный список */
.pfull{border-radius:20px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px}
.pfull .promo{aspect-ratio:2/1;border-radius:0;box-shadow:none;flex:none;width:100%}
.pfull .tx{padding:13px 15px 15px}
.pfull .tx p{font-size:14px;color:var(--body);white-space:pre-line}
.pfull .tx .btn{margin-top:12px}

/* кабинет */
.hero{position:relative;border-radius:22px;overflow:hidden;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,var(--sea) 0%,var(--sea2) 60%,#073C42 100%);box-shadow:0 14px 30px rgba(14,124,134,.3)}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::after{content:"🐚";position:absolute;right:16px;top:14px;font-size:34px;opacity:.5}
.hero .hi{font-size:14px;font-weight:700;opacity:.9}
.hero .bal{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums}
.hero .bal small{font-size:15px;font-weight:700;opacity:.85;margin-left:6px;letter-spacing:0}
.hero .rule{font-size:12.5px;opacity:.85;margin-top:4px}
.hero .lvl{display:flex;gap:8px;margin-top:14px}
.hero .lvl div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.hero .lvl b{display:block;font-size:17px;font-weight:800}
.hero .lvl small{font-size:11px;opacity:.85}
.ref{margin-top:14px;border-radius:20px;padding:16px;background:linear-gradient(135deg,#FFF3EC,#FDE3D6);color:#4A2213;position:relative;overflow:hidden}
:root[data-theme="dark"] .ref{background:linear-gradient(135deg,#3A2219,#2A1912);color:#F8D9CB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ref{background:linear-gradient(135deg,#3A2219,#2A1912);color:#F8D9CB}}
.ref::after{content:"🎁";position:absolute;right:14px;top:10px;font-size:40px;opacity:.85}
.ref h3{font-size:17px;font-weight:800;padding-right:50px}
.ref p{font-size:13px;margin-top:4px;opacity:.9;padding-right:30px}
.ref .code{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;background:rgba(255,255,255,.7);border:1.5px dashed var(--coral);border-radius:12px;padding:9px 12px}
:root[data-theme="dark"] .ref .code{background:rgba(0,0,0,.25)}
.ref .code b{font-size:18px;letter-spacing:2px;font-weight:800;color:var(--coral2)}
.ref .code button{font-size:13px;font-weight:800;color:var(--coral2)}
.ref .acts{display:flex;gap:8px;margin-top:10px}
.ref .acts .btn{flex:1;background:var(--coral);color:#fff;padding:12px}
.ref .cnt{font-size:12.5px;margin-top:10px;font-weight:700}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how div{background:var(--card);border-radius:16px;padding:12px 10px;box-shadow:var(--shadow);text-align:center}
.how i{display:block;font-style:normal;font-size:24px}
.how b{display:block;font-size:15px;color:var(--ink);font-weight:800;margin-top:4px}
.how small{display:block;font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}
.oc{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:10px}
.oc .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.oc .h b{font-size:15px;color:var(--ink);font-weight:800}
.oc .meta{font-size:12px;color:var(--muted);margin-top:2px}
.oc .ln{font-size:12.5px;color:var(--body);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.oc .ft strong{font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.oc .ft button{font-size:13px;font-weight:800;color:var(--sea);background:var(--sea-soft);border-radius:10px;padding:7px 11px}
.st{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.st.new{background:#E8EEF7;color:#2F5597}.st.confirmed{background:var(--sea-soft);color:var(--sea)}.st.going{background:#FFF4D6;color:#8A6400}.st.done{background:#E2F4EA;color:var(--ok)}.st.canceled{background:var(--soft);color:var(--muted)}
.hist{background:var(--card);border-radius:16px;padding:2px 14px;box-shadow:var(--shadow)}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist div:last-child{border-bottom:0}
.hist b{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist b.p{color:var(--ok)}.hist b.m{color:var(--coral2)}
.hist small{display:block;font-size:11px;color:var(--muted)}
.cta{background:var(--card);border-radius:20px;padding:22px 18px;text-align:center;box-shadow:var(--shadow)}
.cta .big{font-size:44px}
.cta h3{font-size:18px;color:var(--ink);font-weight:800;margin:8px 0 6px}
.cta p{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.contacts{display:flex;gap:8px;margin-top:10px}
.contacts a{flex:1;text-decoration:none}

/* карточка товара, всплывающие окна */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .ov{position:absolute;inset:0;background:rgba(5,15,20,.55)}
.sheet .pan{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .pic{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;font-size:64px}
.sheet .pic img{width:100%;height:100%;object-fit:cover}
.sheet .body{padding:16px}
.sheet h3{font-size:21px;font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.3px}
.sheet .x{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.sheet .bigpr{font-size:24px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.sheet .bigpr s{font-size:15px;color:var(--muted);margin-left:6px;font-weight:600}
.sheet .bigpr.sale{color:var(--coral2)}
.modal{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .ov{position:absolute;inset:0;background:rgba(5,15,20,.6)}
.modal .box{position:relative;width:100%;max-width:380px;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .25s ease-out}
.modal .promo{aspect-ratio:16/10;border-radius:0;box-shadow:none;flex:none;width:100%}
.modal .tx{padding:14px 18px 18px}
.modal .tx p{font-size:14px;color:var(--body)}
.modal .tx .btn{margin-top:14px}
.modal .x{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:19px}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:12px;z-index:50;max-width:90%;text-align:center}
.skel{padding:16px}
.skel div{background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px;margin-bottom:12px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <div class="brand">
      <div class="logo"><i aria-hidden="true">🐟</i><div><b id="brand">Seafood Сочи</b><small id="sub">Доставка морепродуктов по Сочи</small></div></div>
      <button class="bchip" id="bchip" data-go="account" hidden><span>💎</span><em id="bchipN" style="font-style:normal">0</em></button>
    </div>
    <div class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Найти рыбу, икру, краба…" autocomplete="off"><button class="x" id="qx" hidden aria-label="Очистить">×</button></div>
    <nav class="pills" id="pills"></nav>
  </header>

  <main id="shop"><div class="skel"><div style="height:170px"></div><div style="height:96px"></div><div style="height:220px"></div></div></main>
  <section id="saleView" class="view" hidden></section>
  <section id="cartView" class="view" hidden></section>
  <section id="formView" class="view" hidden></section>
  <section id="doneView" class="view" hidden></section>
  <section id="accountView" class="view" hidden></section>
</div>

<div class="bar" id="bar" hidden><button id="barBtn" type="button"><div><small id="barCnt"></small><b id="barSum"></b></div><span class="go" id="barGo">Корзина →</span></button></div>
<div class="tabs"><nav id="tabs">
  <button class="tab on" data-tab="shop"><span class="ic">🐟</span>Магазин</button>
  <button class="tab" data-tab="sale"><span class="ic">🔥</span>Акции</button>
  <button class="tab" data-tab="cart"><span class="ic">🛒</span>Корзина<span class="cnt" id="tabCnt" hidden></span></button>
  <button class="tab" data-tab="account"><span class="ic">👤</span>Кабинет</button>
</nav></div>
<div class="sheet" id="sheet" hidden><div class="ov" data-close></div><div class="pan" id="sheetPan"></div></div>
<div class="modal" id="modal" hidden><div class="ov" data-mclose></div><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="pricing.js"></script>
<script>
(function(){
'use strict';
var P = window.Pricing;
var qs = new URLSearchParams(location.search);
var PLATFORM = qs.get('p') === 'max' ? 'max' : qs.get('p') === 'tg' ? 'tg' : 'web';
var SDK = { tg:'https://telegram.org/js/telegram-web-app.js', max:'https://st.max.ru/js/max-web-app.js' };
var WA = null;              // объект мессенджера (Telegram.WebApp или window.WebApp в MAX)
var INIT = '';              // подписанная строка initData
var DATA = null, BY = {};   // каталог
var cart = {}, profile = {}, ACC = null;
var screen = 'shop', query = '', form = { time:'', pay:'', useBonus:false };
var BASE = location.pathname.replace(/app\/[^/]*$/, ''); // корень сервера (учитывает подпуть)
var COLORS = ['#0E7C86','#E4572E','#1F3A5F','#7A4FB5','#C99A2E','#2E8B57'];
var DECO = { account:'🎁', sale:'🔥', product:'🦐', category:'🐟', url:'✨', none:'🌊' };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function haptic(kind){ try{ if(!WA||!WA.HapticFeedback) return; kind ? WA.HapticFeedback.notificationOccurred(kind) : WA.HapticFeedback.impactOccurred('light'); }catch(e){} }
function toast(t){ var el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){el.hidden=true;},2000); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function ddmm(s){ return s ? s.slice(8,10)+'.'+s.slice(5,7) : ''; }
function dt(ms){ var d=new Date(ms); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }

function loadSdk(){
  return new Promise(function(res){
    if(PLATFORM==='web') return res();
    var s=document.createElement('script'); s.src=SDK[PLATFORM]; s.onload=res; s.onerror=res; document.head.appendChild(s);
    setTimeout(res,2500);
  });
}
function initSdk(){
  WA = PLATFORM==='tg' ? (window.Telegram && window.Telegram.WebApp) : PLATFORM==='max' ? window.WebApp : null;
  if(!WA) return;
  INIT = WA.initData || '';
  try{ WA.ready && WA.ready(); }catch(e){}
  try{ WA.expand && WA.expand(); }catch(e){}
  if(PLATFORM==='tg' && WA.colorScheme) document.documentElement.setAttribute('data-theme', WA.colorScheme);
  try{ var bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); WA.setHeaderColor && WA.setHeaderColor(bg); WA.setBackgroundColor && WA.setBackgroundColor(bg); }catch(e){}
  try{ WA.BackButton && WA.BackButton.onClick && WA.BackButton.onClick(back); }catch(e){}
}
function api(method, path, body){
  var opt = { method:method, headers:{'Content-Type':'application/json'} };
  if(body) opt.body = JSON.stringify(Object.assign({ platform:PLATFORM, initData:INIT }, body));
  return fetch(BASE + path, opt).then(function(r){ return r.json().then(function(j){ j._status=r.status; return j; }); });
}
function openLink(url){
  try{
    if(PLATFORM==='tg' && /^https:\/\/t\.me\//.test(url) && WA.openTelegramLink) return WA.openTelegramLink(url);
    if(WA && WA.openLink) return WA.openLink(url);
  }catch(e){}
  window.open(url,'_blank','noopener');
}

/* ---------- каталог ---------- */
function list(){ return DATA.products; }
function shown(p){ if(!query) return true; var n=(p.fullName+' '+p.note).toLowerCase().replace(/ё/g,'е'); return n.indexOf(query)!==-1; }
function catOf(p){ return DATA.cats.find(function(x){return x.cid===p.cid;}); }
function emojiOf(p){ var c=catOf(p); return c?c.emoji:'🐟'; }

function priceHtml(p){
  if(P.isAsk(p)) return '<div class="pr">по запросу</div>';
  var u = p.unit==='кг' ? '<u>/кг</u>' : '';
  var h = P.onSale(p) ? '<div class="pr">'+P.ru(P.eff(p))+' ₽'+u+'<s>'+P.ru(p.price)+'</s></div>' : '<div class="pr">'+P.ru(p.price)+' ₽'+u+'</div>';
  var hint = P.hintText(p);
  return h + (hint ? '<div class="hint">'+esc(hint)+'</div>' : '');
}
function ctlHtml(p, sm){
  if(P.isAsk(p)) return '<span class="req">Узнать в чате</span>';
  var q = cart[p.id];
  if(!q) return '<button class="add" data-add="'+p.id+'">В корзину</button>';
  return '<div class="step'+(sm?' sm':'')+'"><button data-dec="'+p.id+'" aria-label="Меньше">−</button><span>'+P.qtyLabel(p,q)+'</span><button data-inc="'+p.id+'" aria-label="Больше">+</button></div>';
}
function photo(p){
  if(!p.thumb) return '<div class="ph">'+emojiOf(p)+'</div>';
  return '<div class="ph"><img src="'+esc(p.thumb)+'" alt="" loading="lazy" data-full="'+esc(p.image)+'" data-emoji="'+emojiOf(p)+'"></div>';
}
function cardHtml(p){
  var sale = P.onSale(p);
  return '<div class="pc'+(sale?' sale':'')+'" data-open="'+p.id+'">'+(sale?'<span class="badge">−'+P.saleOff(p)+'%</span>':'')+photo(p)+
    '<div class="in"><div class="nm">'+esc(p.name)+'</div>'+(p.note?'<div class="nt">'+esc(p.note)+'</div>':'<div class="nt">&nbsp;</div>')+priceHtml(p)+
    '<div class="ctl" data-ctl="'+p.id+'">'+ctlHtml(p)+'</div></div></div>';
}

/* ---------- акции-баннеры ---------- */
function promoColor(x,i){ return x.color || COLORS[i % COLORS.length]; }
function promoHtml(x,i,full){
  var img = x.image ? '<img class="bgimg" src="'+esc(x.image)+'" alt="" loading="lazy">' : '<span class="deco" aria-hidden="true">'+(DECO[x.link_type]||'🌊')+'</span>';
  return '<button class="promo'+(x.image?'':' noimg')+'" data-promo="'+esc(x.id)+'" style="background:'+esc(promoColor(x,i))+'">'+img+
    (x.badge?'<span class="bdg">'+esc(x.badge)+'</span>':'<span class="bdg" style="visibility:hidden">.</span>')+
    '<h3>'+esc(x.title)+'</h3>'+(full?'':'<p>'+esc(x.text)+'</p>')+(x.to?'<span class="till">до '+ddmm(x.to)+'</span>':'')+'</button>';
}
function promoAction(x){
  if(x.link_type==='product' && BY[x.link_id]) return { label:x.btn||'Смотреть товар', go:function(){ closeModal(); openCard(+x.link_id); } };
  if(x.link_type==='category') return { label:x.btn||'Перейти в раздел', go:function(){ closeModal(); jump(x.link_id); } };
  if(x.link_type==='sale') return { label:x.btn||'Смотреть акции', go:function(){ closeModal(); go('sale'); } };
  if(x.link_type==='account') return { label:x.btn||'Открыть кабинет', go:function(){ closeModal(); go('account'); } };
  if(x.link_type==='url' && x.link_id) return { label:x.btn||'Подробнее', go:function(){ openLink(x.link_id); } };
  return null;
}
function openPromo(id){
  var i=DATA.promos.findIndex(function(x){return x.id===id;}); if(i<0) return;
  var x=DATA.promos[i], a=promoAction(x);
  $('modalBox').innerHTML='<button class="x" data-mclose aria-label="Закрыть">×</button>'+promoHtml(x,i,true)+
    '<div class="tx"><p>'+esc(x.text).replace(/\n/g,'<br>')+'</p>'+(a?'<button class="btn w" data-pact="'+esc(x.id)+'">'+esc(a.label)+'</button>':'<button class="btn alt w" data-mclose>Понятно</button>')+'</div>';
  $('modal').hidden=false; showBack(true);
}
function closeModal(){ $('modal').hidden=true; showBack(screen!=='shop'); }
var carT=null;
function startCarousel(){
  clearInterval(carT);
  var sc=$('promoScroll'); if(!sc || sc.children.length<2) return;
  var dots=$('promoDots');
  function idx(){ return Math.round(sc.scrollLeft / (sc.children[0].offsetWidth+10)); }
  sc.addEventListener('scroll',function(){ var k=idx(); Array.prototype.forEach.call(dots.children,function(d,j){ d.classList.toggle('on',j===k); }); },{passive:true});
  var paused=false; sc.addEventListener('touchstart',function(){ paused=true; },{passive:true});
  carT=setInterval(function(){
    if(paused || screen!=='shop' || document.hidden || !document.body.contains(sc)) return;
    var k=(idx()+1) % sc.children.length;
    sc.scrollTo({ left:sc.children[k].offsetLeft-16, behavior:'smooth' });
  },5000);
}

/* ---------- главная ---------- */
function renderShop(){
  var html='';
  var sales=list().filter(function(p){return P.onSale(p)&&shown(p);});
  if(!query){
    if(DATA.promos.length){
      html+='<section class="promos"><div class="hscroll" id="promoScroll">'+DATA.promos.map(function(x,i){return promoHtml(x,i);}).join('')+'</div>'+
        (DATA.promos.length>1?'<div class="dots" id="promoDots">'+DATA.promos.map(function(x,i){return '<i'+(i?'':' class="on"')+'></i>';}).join('')+'</div>':'')+'</section>';
    }
    html+='<section class="blk"><h2>Каталог</h2><div class="tiles">'+DATA.cats.map(function(c){
      return '<button class="tile'+(c.image?'':' noimg')+'" data-jump="'+c.cid+'">'+(c.image?'<img src="'+esc(c.image)+'" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">':'')+'<span class="em">'+(c.image?'':c.emoji)+'</span><b>'+esc(c.name)+'</b></button>';
    }).join('')+'</div></section>';
    if(DATA.bonus && DATA.bonus.enabled && (DATA.bonus.cashback || DATA.bonus.welcome)){
      html+='<button class="bonusband" data-go="account"><span class="ic">💎</span><div><b>'+(ACC?'У вас '+ACC.bonus.balance+' '+P.plural(ACC.bonus.balance,'бонус','бонуса','бонусов'):'Бонусы за каждый заказ')+'</b><small>'+
        (DATA.bonus.cashback?'Кешбэк '+DATA.bonus.cashback+'% · ':'')+(DATA.bonus.referrer?'+'+DATA.bonus.referrer+' за друга':'оплата до '+DATA.bonus.maxPay+'% заказа')+'</small></div><span class="ar">›</span></button>';
    }
    if(sales.length) html+='<section class="blk hot"><h2>🔥 Скидки недели <button data-tab="sale">Все</button></h2><div class="hscroll">'+sales.map(cardHtml).join('')+'</div></section>';
  }
  var any=false;
  DATA.cats.forEach(function(c){
    var items=list().filter(function(p){return p.cid===c.cid&&shown(p);});
    if(!items.length) return; any=true;
    html+='<section class="sec" id="s-'+c.cid+'"><h2>'+c.emoji+' '+esc(c.name)+' <span>'+items.length+'</span></h2><div class="grid">'+items.map(cardHtml).join('')+'</div></section>';
  });
  if(query && !any) html+='<div class="empty">Ничего не нашлось по «'+esc(query)+'».<br>Попробуйте другое слово или спросите менеджера в чате.</div>';
  else if(DATA.settings.price_date) html+='<p class="note">Цены актуальны на '+esc(DATA.settings.price_date)+'. Весовой товар взвешиваем при сборке — итог подтвердит менеджер.</p>';
  $('shop').innerHTML=html;
  startCarousel();
}
function renderPills(){
  $('pills').innerHTML=DATA.cats.map(function(c){ return '<button class="pill" data-jump="'+c.cid+'">'+c.emoji+' '+esc(c.name)+'</button>'; }).join('');
}
function jump(cid){
  if(screen!=='shop') go('shop');
  if(query){ query=''; $('q').value=''; $('qx').hidden=true; renderShop(); }
  document.querySelectorAll('.pill').forEach(function(b){ b.classList.toggle('on', b.dataset.jump===cid); });
  var s=$('s-'+cid); if(s) window.scrollTo({top:s.getBoundingClientRect().top+scrollY-$('top').offsetHeight-4,behavior:'smooth'});
}
function refreshCtl(id){
  var p=BY[id];
  document.querySelectorAll('[data-ctl="'+id+'"]').forEach(function(el){ el.innerHTML=ctlHtml(p, el.dataset.sm==='1'); });
  if(!$('sheet').hidden && +$('sheetPan').dataset.id===+id) openCard(id, true);
}

/* ---------- акции ---------- */
function renderSale(){
  var v=$('saleView'), sales=list().filter(function(p){return P.onSale(p);});
  var html='<h1>Акции</h1>';
  DATA.promos.forEach(function(x,i){
    var a=promoAction(x);
    html+='<div class="pfull">'+promoHtml(x,i,true)+'<div class="tx"><p>'+esc(x.text)+'</p>'+(a?'<button class="btn" data-pact="'+esc(x.id)+'">'+esc(a.label)+' →</button>':'')+'</div></div>';
  });
  if(sales.length) html+='<h2>🔥 Товары со скидкой</h2>';
  v.innerHTML=html+(sales.length?'<div class="grid" style="padding:0">'+sales.map(cardHtml).join('')+'</div>':'')+
    (!DATA.promos.length&&!sales.length?'<div class="empty">Сейчас акций нет — загляните позже 🐟</div>':'');
}

/* ---------- корзина ---------- */
function totals(){ return P.cartLines(cart, BY); }
var syncT=null;
function setQty(id, q){
  var p=BY[id]; q=P.normQty(p,q);
  if(q) cart[id]=q; else delete cart[id];
  haptic(); refreshCtl(id); renderBar();
  if(screen==='cart') renderCart();
  saveCart();
}
function saveCart(){
  store('cart_'+PLATFORM, cart);
  clearTimeout(syncT);
  if(PLATFORM!=='web') syncT=setTimeout(function(){ api('PUT','api/cart',{cart:cart}).catch(function(){}); },600);
}
function bonusAvail(sum){
  if(!ACC || !ACC.bonus.enabled) return 0;
  return Math.max(0, Math.min(ACC.bonus.balance, Math.floor(sum*ACC.bonus.maxPay/100)));
}
function renderBar(){
  var t=totals(), n=t.lines.length, min=DATA.settings.min_order||0;
  var bar=$('bar'), btn=$('barBtn'), cnt=$('tabCnt');
  cnt.hidden=!n; cnt.textContent=n;
  if(screen==='done' || screen==='account' || screen==='sale' && !n || (!n && screen==='shop') || (!n && screen==='cart')){ bar.hidden=true; return; }
  bar.hidden=false;
  if(screen==='shop'||screen==='sale'){ $('barCnt').textContent=n+' '+P.plural(n,'позиция','позиции','позиций'); $('barSum').textContent=(t.weighed?'≈ ':'')+P.rub(t.sum); $('barGo').textContent='Корзина →'; btn.disabled=false; }
  if(screen==='cart'){ $('barCnt').textContent=min&&t.sum<min?'Минимум '+P.rub(min):'Итого примерно'; $('barSum').textContent=P.rub(t.sum); $('barGo').textContent='Оформить →'; btn.disabled=!n||(min&&t.sum<min); }
  if(screen==='form'){ var b=form.useBonus?bonusAvail(t.sum):0; $('barCnt').textContent=b?'К оплате с бонусами':'К оплате примерно'; $('barSum').textContent=P.rub(t.sum-b); $('barGo').textContent='Отправить заказ'; btn.disabled=false; }
}
function thumbOf(p){ return p.thumb ? '<div class="th"><img src="'+esc(p.thumb)+'" alt="" data-full="'+esc(p.image)+'" data-emoji="'+emojiOf(p)+'"></div>' : '<div class="th">'+emojiOf(p)+'</div>'; }
function renderCart(){
  var t=totals(), min=DATA.settings.min_order||0, v=$('cartView');
  if(!t.lines.length){ v.innerHTML='<h1>Корзина</h1><div class="cta"><div class="big">🧺</div><h3>Корзина пока пустая</h3><p>Загляните в каталог — свежая рыба, икра и креветки ждут.</p><button class="btn" data-go="shop">Перейти в каталог</button></div>'; renderBar(); return; }
  var rows=t.lines.map(function(l){ var p=BY[l.id];
    return '<div class="ci">'+thumbOf(p)+'<div class="i"><b>'+esc(p.fullName)+'</b><small>'+esc(P.priceText(p))+(P.mode(p)==='piece'?' · '+esc(P.hintText(p)):'')+'</small></div>'+

function go(s){
  screen=s;
  Object.keys(VIEWS).forEach(function(k){ $(VIEWS[k]).hidden = k!==s; });
  $('top').hidden = s!=='shop';
  var tab = s==='form'||s==='done' ? 'cart' : s;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); });

  if(s==='shop') renderShop();
  if(s==='sale') renderSale();

}
function back(){

  if(!$('sheet').hidden) return closeCard();
  if(screen==='form') return go('cart');
  if(screen!=='shop') return go('shop');
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button,a,[data-open],[data-close],[data-mclose]'); if(!t) return;
  var d=t.dataset;
  if(d.add){ e.stopPropagation(); return setQty(d.add, P.firstQty(BY[d.add])); }
  if(d.inc){ e.stopPropagation(); return setQty(d.inc, P.inc(BY[d.inc], cart[d.inc]||0)); }
  if(d.dec){ e.stopPropagation(); return setQty(d.dec, P.dec(BY[d.dec], cart[d.dec]||0)); }
  if(d.close!==undefined) return closeCard();
  if(d.mclose!==undefined) return closeModal();
  if(d.open && !e.target.closest('.ctl')) return openCard(d.open);
  if(d.promo) return openPromo(d.promo);
  if(d.pact){ var x=DATA.promos.find(function(y){return y.id===d.pact;}); var a=x&&promoAction(x); if(a) a.go(); return; }
  if(d.jump) return jump(d.jump);
  if(d.tab){ haptic(); return go(d.tab); }
  if(d.go) return go(d.go);
  if(d.repeat) return repeatOrder(d.repeat);
  if(d.copy) return copy(d.copy);
  if(d.share!==undefined) return share();
  if(d.clear!==undefined){ Object.keys(cart).forEach(function(id){ delete cart[id]; }); saveCart(); return go('shop'); }
  if(d.time){ form.time=d.time; document.querySelectorAll('[data-time]').forEach(function(b){b.classList.toggle('on',b===t);}); return; }
  if(d.pay){ form.pay=d.pay; document.querySelectorAll('[data-pay]').forEach(function(b){b.classList.toggle('on',b===t);}); return; }
  if(t.id==='bonusTg'){ form.useBonus=!form.useBonus; t.classList.toggle('on',form.useBonus); haptic(); renderSum(); renderBar(); return; }
  if(d.closeapp!==undefined){ try{ WA.close(); }catch(x){ go('shop'); } return; }
});

  if(ses && ses._status===401){ toast('Откройте магазин из бота заново'); }
  if(!Object.keys(cart).length){ cart=store('cart_'+PLATFORM)||{}; if(Object.keys(cart).length) saveCart(); }
  Object.keys(cart).forEach(function(id){ if(!BY[id]) delete cart[id]; });
  paintChip(); renderPills();
  var start = qs.get('tab');
  go(VIEWS[start] ? start : 'shop');
  if(ses && ses.gift && ses.gift.welcome) giftModal(ses.gift); else popupPromo();
}).catch(function(){
  $('shop').innerHTML='<div class="empty">Не удалось загрузить каталог. Проверьте интернет и откройте магазин ещё раз.</div>';
});
})();
</script>
</body>
</html>
